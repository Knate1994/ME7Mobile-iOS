name: build-ipa

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen librsvg
          mkdir -p Assets.xcassets/AppIcon.appiconset
          rsvg-convert -w 1024 -h 1024 Assets/ME7Mobile-icon.svg -o Assets.xcassets/AppIcon.appiconset/AppIcon.png
          xcodegen generate

      - name: Build (unsigned, Sideloadly signs it with your Apple ID)
        run: |
          xcodebuild -project ME7Mobile.xcodeproj -target ME7Mobile -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/ME7Mobile.app Payload/
          zip -qr ME7Mobile.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ME7Mobile-ipa
          path: ME7Mobile.ipa
